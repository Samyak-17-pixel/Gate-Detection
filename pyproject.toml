[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gate-detection"
version = "0.1.0"
description = "Classical OpenCV pipeline for SAUVC navigation and qualification gates."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "opencv-python==4.8.1.78",
    "numpy==1.24.4",
]

[tool.setuptools.packages.find]
include = ["gate_detection*"]
